<!DOCTYPE html>
<html>
<head>
    <title>Concat Example</title>
</head>
<body>

<script>
    let numbers = [1, 2, 3, 4, 5];
    let extraNumbers = [6, 7];

    let result = numbers.concat(extraNumbers);

    document.write("Array after concat(): " + result);
</script>

</body>
</html>
